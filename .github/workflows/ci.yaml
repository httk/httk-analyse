name: httk-analyse CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      python-version:
        description: Python version
        required: false
        default: "3.12"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        extras: [dev, 'dev,default']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: ${{ github.event.inputs.python-version || '3.12' }}
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          pip install -e '.[${{ matrix.extras }}]'

      - name: Verify default extra selects HiGHS
        if: matrix.extras == 'dev,default'
        run: >-
          python -c 'from httk.analyse.generic import LowerConvexHull;
          assert LowerConvexHull([(0.0,)], [0.0]).solver == "highs"'

      - name: Run CI
        run: make ci
